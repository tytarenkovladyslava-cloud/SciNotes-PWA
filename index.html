<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2a7b88" />
    <title>MyFlashCards PWA</title>
    <link rel="manifest" href="manifest.json" />
    <link rel="apple-touch-icon" href="icon.png" />
    <link rel="stylesheet" href="style.css" />
</head>
<body>
<main class="container">
    <header>
        <div>
            <h1>MyFlashCards</h1>
        </div>
        <span id="status" class="badge online">Online</span>
    </header>

    <form id="cardForm" class="card-form">
        <input type="text" id="wordInput" placeholder="Англійське слово (напр. resilience)" required />
        <input type="text" id="transInput" placeholder="Переклад або значення" required />
        <button type="submit" id="addBtn">Додати картку</button>
    </form>

    <section id="trainerSection" class="trainer hidden">
        <div class="flashcard" id="flashcard">
            <div class="flashcard-inner">
                <div class="flashcard-front">
                    <span class="hint">Натисніть на картку, щоб перевернути</span>
                    <h2 id="frontWord">Word</h2>
                    <p id="frontPhonetic" class="phonetic"></p>
                    <button type="button" id="speakBtn" class="speak-btn">Озвучити</button>
                </div>
                <div class="flashcard-back">
                    <h3 id="backTrans">Переклад</h3>
                    <p id="backDef" class="definition"></p>
                    <p id="backExample" class="example"></p>
                </div>
            </div>
        </div>

        <div class="controls">
            <button type="button" id="prevBtn" class="nav-btn">← Назад</button>
            <span id="counter">1 / 1</span>
            <button type="button" id="nextBtn" class="nav-btn">Далі →</button>
        </div>
    </section>

    <section class="list-section">
        <h3>Збережені слова</h3>
        <ul id="cardsList"></ul>
    </section>
</main>

<script src="app.js"></script>
</body>
</html>
